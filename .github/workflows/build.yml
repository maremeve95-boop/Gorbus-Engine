name: Gorbus Engine build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check restored editor and enhancement modules
        run: npm run check
      - name: Build production bundle
        run: npm run build
      - name: Package source ZIP
        run: zip -qr Gorbus_Engine_v0.7.zip . -x '.git/*' 'node_modules/*' 'dist/*'
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gorbus-Engine-v0.7-source
          path: Gorbus_Engine_v0.7.zip
          retention-days: 7
