name: Gorbus Engine GE 1.0.4

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Restore and check all GE modules
        run: npm run check
      - name: Build production bundle
        run: npm run build
      - name: Package source ZIP
        run: zip -qr /tmp/Gorbus_Engine_GE_1.0.4.zip . -x '.git/*' 'node_modules/*' 'dist/*' '*.zip' && cp /tmp/Gorbus_Engine_GE_1.0.4.zip ./Gorbus_Engine_GE_1.0.4.zip
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gorbus-Engine-GE-1.0.4
          path: Gorbus_Engine_GE_1.0.4.zip
          retention-days: 14
