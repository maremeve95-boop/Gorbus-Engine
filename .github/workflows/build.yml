name: Gorbus Engine 3.0.0 Preview

on:
  push:
    branches: [main, release/ge-3.0.0]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore and verify GE 3.0.0 sources
        run: npm run check
      - name: Build production bundle
        run: npm run build
      - name: Package source ZIP
        run: zip -qr /tmp/Gorbus_Engine_GE_3.0.0_Preview.zip . -x '.git/*' 'node_modules/*' 'dist/*' '*.zip' && cp /tmp/Gorbus_Engine_GE_3.0.0_Preview.zip ./Gorbus_Engine_GE_3.0.0_Preview.zip
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gorbus-Engine-GE-3.0.0-Preview
          path: Gorbus_Engine_GE_3.0.0_Preview.zip
          retention-days: 14
